name: Feature Request
description: Have a feature idea? Tell us about it
title: "[Enhancement]: "
labels: ["enhancement", "new"]
assignees:
  - chiefpansancolt
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to tell us about your idea to help make DevHub better!
  - type: textarea
    id: idea
    attributes:
      label: What is the idea?
      placeholder: Tell us what you are thinking about!
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve?
      description: Describe what you are trying to do today and what gets in the way.
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/chiefpansancolt/devhub/blob/main/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true

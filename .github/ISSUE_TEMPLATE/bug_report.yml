name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "new"]
assignees:
  - chiefpansancolt
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: DevHub version
      description: Shown in the DevHub menu, under About DevHub.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 15.5"
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac type
      options:
        - Apple Silicon
        - Intel
  - type: checkboxes
    id: tools
    attributes:
      label: Which tool is involved?
      options:
        - label: Homebrew
        - label: Node
        - label: Ruby
        - label: Not tied to one tool
  - type: input
    id: language
    attributes:
      label: App language
      description: The language DevHub is running in, if it is not English.
      placeholder: "Deutsch"
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: In DevHub, open History, select the failing entry and choose Copy output. You can also paste the command and its exit code. This will be formatted as code, so no backticks are needed.
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/chiefpansancolt/devhub/blob/main/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
